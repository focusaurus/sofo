<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="sofo">
  <title>sofo</title>
  <!-- The app in miniature: a sheet of paper carrying three colored phrase bars.
       The tints are saturated well past the sheet's own (~L92) values — at 16px
       the printed pastels would wash out to white, so legibility wins over
       literal color matching. -->
  <rect width="512" height="512" rx="40" fill="#fff"/>
  <g>
    <rect x="72" y="96" width="368" height="88" rx="8" fill="#1f7f96"/>
    <rect x="72" y="212" width="368" height="88" rx="8" fill="#c2412f"/>
    <rect x="72" y="328" width="368" height="88" rx="8" fill="#6f8c22"/>
  </g>
</svg>
