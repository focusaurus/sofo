<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>sofo — song form notation</title>
    <!-- Modern browsers take the SVG and scale it crisply at any size; favicon.ico
         (16/32/48) is only there for older ones and for the bare /favicon.ico
         request browsers make regardless of these tags. Paths are relative so the
         site works when served from a subdirectory. -->
    <link rel="icon" href="src/icon.svg" type="image/svg+xml" />
    <link rel="icon" href="favicon.ico" sizes="16x16 32x32 48x48" />
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
    <link rel="manifest" href="site.webmanifest" />
    <meta name="theme-color" content="#6b7080" />

    <!-- Social previews. Crawlers do not resolve relative URLs reliably and never
         run JS, so og:url and og:image are absolute and hardcoded to the canonical
         host; update them together if the site ever moves. -->
    <meta
      name="description"
      content="Song form documents: your song's form, lyrics, chords, and notes on one readable page, built for reading from a tablet or paper at rehearsals and gigs."
    />
    <link rel="canonical" href="https://sofo.peterlyons.org/" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="sofo" />
    <meta property="og:title" content="sofo — song form notation" />
    <meta
      property="og:description"
      content="Your song's form, lyrics, chords, and notes on one readable page. Free, in your browser."
    />
    <meta property="og:url" content="https://sofo.peterlyons.org/" />
    <meta property="og:image" content="https://sofo.peterlyons.org/icons/og.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="The sofo wordmark beside a song sheet showing three sections of colored phrase bars with lyrics."
    />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="stylesheet" href="src/sheet.css" />
  </head>
  <body>
    <song-controls for="sheet"></song-controls>
    <song-sheet id="sheet" data-src="songs/start-here.sf.json" transpose="C"></song-sheet>
    <script type="module" src="src/sheet.js"></script>
  </body>
</html>
